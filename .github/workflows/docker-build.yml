name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: romantony
  IMAGE_NAME: storystudio-multitalk
  VERSION: "1.0.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Free up disk space
      run: |
        echo "Before cleanup:"
        df -h
        # This image's base (runpod/pytorch, CUDA 12.9) is large enough that
        # the standard dotnet/android/ghc/CodeQL removal (~20GB) isn't
        # enough -- build was failing with "No space left on device" even
        # before pip installs ran, mid-way through extracting the base
        # image layers. Also remove the rest of hostedtoolcache, swap, and
        # apt caches for extra headroom.
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/lib/jvm
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo apt-get remove -y '^ghc-.*' '^dotnet-.*' '^llvm-.*' 'php.*' \
          azure-cli google-cloud-cli google-chrome-stable firefox powershell \
          mono-devel --fix-missing -y > /dev/null 2>&1 || true
        sudo apt-get autoremove -y > /dev/null 2>&1 || true
        sudo apt-get clean
        sudo docker image prune -af
        sudo docker builder prune -af
        echo "After cleanup:"
        df -h

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image digest
      run: echo "Image pushed successfully!"
